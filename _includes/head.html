<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>
  {%- if page.url == "/" -%}
    {{ site.title | escape }}
  {%- else -%}
    {{ page.title | escape }} · {{ site.title | escape }}
  {%- endif -%}
</title>
<meta name="description" content="{{ page.description | default: site.description | escape }}">
<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=Source+Serif+4:opsz,wght@8..60,460;8..60,600&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
